name: Quality
on:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Also run Firefox and WebKit core flows
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  HUSKY: '0'
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.12'
      - run: bun install --frozen-lockfile
      - run: bun run check
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.12'
      - run: bun install --frozen-lockfile
      - run: bun run audit:security
  browsers:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.12'
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        if: ${{ !inputs.release }}
        run: bunx playwright install --with-deps chromium
      - name: Install release browsers
        if: ${{ inputs.release }}
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: Production build and Chromium desktop/mobile flows
        if: ${{ !inputs.release }}
        run: bun run test:e2e
      - name: Production build and release flows
        if: ${{ inputs.release }}
        run: bun run test:release
      - name: Report, screenshots and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-report-attempt-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
